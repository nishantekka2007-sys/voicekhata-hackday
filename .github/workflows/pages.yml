name: Deploy VoiceKhata frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("frontend/index.html", "utf8");
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map((match) => match[1].trim())
            .filter(Boolean);
          if (!scripts.length) throw new Error("No inline JavaScript found in frontend/index.html");
          fs.writeFileSync("/tmp/voicekhata-inline.js", scripts.join("\n;\n"));
          NODE
          node --check /tmp/voicekhata-inline.js
          node --check frontend/whisper-stt.js
          node --check frontend/cloud.js
          node --check frontend/config.js
          node --check frontend/transaction-parser.js
          node frontend/transaction-parser.test.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
