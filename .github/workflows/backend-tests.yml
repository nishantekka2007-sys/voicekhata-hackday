name: Backend tests

on:
  push:
    branches: [main, "feat/**", "fix/**", "integration/**"]
  pull_request:
    branches: [main, "feat/**", "fix/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run API tests
        run: pytest -q backend/tests
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/auth.js
          node --check frontend/config.js
          node --check frontend/cloud.js
          node --check frontend/whisper-stt.js
          node --check frontend/transaction-parser.js
          node frontend/transaction-parser.test.js
