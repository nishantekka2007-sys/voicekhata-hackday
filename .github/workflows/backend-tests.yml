name: Backend tests

on:
  push:
    branches: [main, "feat/**", "fix/**", "integration/**"]
  pull_request:
    branches: [main, "feat/**", "fix/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run API tests
        run: pytest -q backend/tests
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/auth.js
          node --check frontend/config.js
          node --check frontend/cloud.js
          node --check frontend/whisper-stt.js
          node --check frontend/transaction-parser.js
          node frontend/transaction-parser.test.js
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("frontend/index.html", "utf8");
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1].trim()).filter(Boolean);
          if (!scripts.length) throw Error("Missing inline frontend script");
          fs.writeFileSync("/tmp/voicekhata-inline.js", scripts.join("\n;\n"));
          NODE
          node --check /tmp/voicekhata-inline.js
