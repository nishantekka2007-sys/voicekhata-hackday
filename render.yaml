# Free-tier Render Blueprint for the VoiceKhata hackathon demo.
# IMPORTANT: Free instances have an ephemeral filesystem. SQLite data can be
# lost when the service sleeps, restarts, or redeploys. Use fake demo data only.
services:
  - type: web
    name: voicekhata-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VOICEKHATA_CORS_ORIGINS
        value: https://nishantekka2007-sys.github.io
      - key: VOICEKHATA_DB_PATH
        value: /tmp/voicekhata.db
